<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormDitto</title>
<link rel="stylesheet" href="sidepanel.css">
<script type="module" src="sidepanel.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="icons/icon-32.png" width="22" height="22" alt="">
    <span class="brand-name">FormDitto</span>
  </div>
  <button id="themeBtn" class="icon-btn round" type="button"></button>
  <button id="settingsBtn" class="icon-btn round" type="button" data-i18n-title="settingsTitle" data-i18n-aria-label="settingsTitle"></button>
</header>
<section id="site" class="site" aria-live="polite"></section>
<div id="notice" role="status" aria-live="polite"></div>
<main id="view"></main>
<input id="importFile" type="file" accept=".json,application/json" hidden>
</body>
</html>
